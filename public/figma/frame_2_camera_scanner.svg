<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#0f141c; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Fullscreen Backdrop -->
  <rect width="390" height="844" fill="#0f141c"/>

  <!-- Top Status Bar -->
  <text x="28" y="28" font-size="14" font-weight="700" fill="#ffffff">9:41</text>
  <circle cx="340" cy="24" r="3" fill="#ffffff"/>
  <circle cx="348" cy="24" r="3" fill="#ffffff"/>
  <rect x="356" y="20" width="16" height="8" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="358" y="22" width="10" height="4" rx="1" fill="#ffffff"/>

  <!-- Top Modal Bar -->
  <g transform="translate(20, 52)">
    <!-- Close Button -->
    <circle cx="20" cy="20" r="20" fill="#1e293b"/>
    <path d="M14 14l12 12m0-12L14 26" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Modal Title -->
    <text x="175" y="26" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Scan document</text>
  </g>

  <!-- Scanner Viewfinder Box -->
  <g transform="translate(45, 130)">
    <!-- Cyan Glowing Border -->
    <rect width="300" height="420" rx="28" fill="#1e293b" fill-opacity="0.4" stroke="#22d3ee" stroke-width="2.5" filter="url(#cyanGlow)"/>

    <!-- Simulated Document Sheet Inside Viewfinder -->
    <g transform="translate(25, 30)">
      <rect width="250" height="360" rx="16" fill="#1e293b" fill-opacity="0.8"/>
      
      <!-- Simulated Document Lines -->
      <rect x="25" y="30" width="100" height="12" rx="4" fill="#64748b"/>
      <rect x="25" y="58" width="200" height="8" rx="3" fill="#475569"/>
      <rect x="25" y="74" width="180" height="8" rx="3" fill="#475569"/>
      <rect x="25" y="90" width="190" height="8" rx="3" fill="#475569"/>

      <rect x="25" y="120" width="80" height="10" rx="3" fill="#64748b"/>
      <rect x="25" y="140" width="195" height="8" rx="3" fill="#475569"/>
      <rect x="25" y="156" width="170" height="8" rx="3" fill="#475569"/>

      <rect x="25" y="220" width="200" height="8" rx="3" fill="#475569"/>
      <rect x="25" y="236" width="150" height="8" rx="3" fill="#475569"/>
    </g>

    <!-- Animated Cyan Laser Scan Line -->
    <line x1="0" y1="210" x2="300" y2="210" stroke="#67e8f9" stroke-width="3" filter="url(#cyanGlow)"/>
    <rect x="10" y="208" width="280" height="4" fill="#22d3ee" fill-opacity="0.7" filter="url(#cyanGlow)"/>
  </g>

  <!-- "Edges found. Hold steady." Live Detection Pill -->
  <g transform="translate(95, 575)">
    <rect width="200" height="36" rx="18" fill="#042f2e" stroke="#14b8a6" stroke-width="1.2"/>
    <circle cx="24" cy="18" r="4" fill="#2dd4bf"/>
    <text x="36" y="22" font-size="12" font-weight="700" fill="#5eead4" letter-spacing="0.2">Edges found. Hold steady.</text>
  </g>

  <!-- Bottom Camera Controls -->
  <g transform="translate(0, 680)">
    <!-- Left: Gallery Icon -->
    <g transform="translate(55, 20)">
      <circle cx="20" cy="20" r="22" fill="#1e293b"/>
      <rect x="12" y="12" width="16" height="16" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
      <circle cx="16" cy="16" r="1.5" fill="#94a3b8"/>
      <path d="M12 24l5-5 4 4 3-3 4 4" stroke="#94a3b8" stroke-width="1.8" fill="none"/>
      <text x="20" y="52" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Gallery</text>
    </g>

    <!-- Center: Large Shutter Button -->
    <g transform="translate(155, 0)">
      <circle cx="40" cy="40" r="38" fill="none" stroke="#475569" stroke-width="4"/>
      <circle cx="40" cy="40" r="30" fill="#2563eb"/>
    </g>

    <!-- Right: Flash Toggle -->
    <g transform="translate(295, 20)">
      <circle cx="20" cy="20" r="22" fill="#1e293b"/>
      <path d="M19 10l-4 10h5l-2 10 7-12h-5z" fill="#94a3b8"/>
      <text x="20" y="52" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Flash</text>
    </g>
  </g>
</svg>
