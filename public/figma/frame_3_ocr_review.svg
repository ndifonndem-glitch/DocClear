<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#f8fafc; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="390" height="844" fill="#f8fafc"/>

  <!-- Top Mobile Status Bar -->
  <text x="28" y="28" font-size="14" font-weight="700" fill="#0f172a">9:41</text>
  <circle cx="340" cy="24" r="3" fill="#0f172a"/>
  <circle cx="348" cy="24" r="3" fill="#0f172a"/>
  <rect x="356" y="20" width="16" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="358" y="22" width="10" height="4" rx="1" fill="#0f172a"/>

  <!-- Sub-Header Navigation -->
  <g transform="translate(20, 52)">
    <text x="0" y="20" font-size="14" font-weight="700" fill="#2563eb">← Back to Capture</text>
    <text x="350" y="20" font-size="12" font-weight="500" fill="#64748b" text-anchor="end">employment.docx</text>
  </g>

  <!-- Content -->
  <g transform="translate(20, 96)">
    <text x="0" y="24" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.3">Review &amp; Correct OCR Text</text>
    <text x="0" y="46" font-size="12" font-weight="500" fill="#64748b">Ensure names, dates, and amounts match before simplifying.</text>

    <!-- OCR Confidence Badge -->
    <g transform="translate(0, 62)">
      <rect width="130" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
      <circle cx="12" cy="12" r="3.5" fill="#10b981"/>
      <text x="24" y="16" font-size="11" font-weight="700" fill="#065f46">98% High Accuracy</text>
    </g>

    <!-- Document Text Editor Box -->
    <g transform="translate(0, 100)">
      <rect width="350" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
      
      <!-- Textarea Content (Monospace feel) -->
      <g transform="translate(16, 26)" font-family="monospace" font-size="11" fill="#1e293b" line-height="1.5">
        <text x="0" y="0" font-weight="700">EMPLOYMENT AGREEMENT</text>
        <text x="0" y="20">Between: Northstar Technologies Ltd.</text>
        <text x="0" y="40">And: Jordan Smith (Junior Developer)</text>
        <text x="0" y="70">1. Start Date: 2 November 2026</text>
        <text x="0" y="90">2. Working Hours: 40 hours/week, 9:00 AM - 5:00 PM</text>
        <text x="0" y="110">   Monday to Friday with 1-hour lunch break.</text>
        <text x="0" y="140">3. Monthly Salary: ₹35,000 gross before tax,</text>
        <text x="0" y="160">   payable on last working day of each month.</text>
        <text x="0" y="190">4. Paid Leave: 18 annual calendar days.</text>
        <text x="0" y="210">5. Probationary Period: 3 months.</text>
        <text x="0" y="240">6. Notice Period Required: 30 calendar days</text>
        <text x="0" y="260">   written notice required after probation.</text>
      </g>

      <!-- Bottom Character Counter -->
      <line x1="0" y1="340" x2="350" y2="340" stroke="#f1f5f9"/>
      <text x="16" y="362" font-size="11" font-weight="500" fill="#94a3b8">462 characters • 76 words</text>
      <text x="334" y="362" font-size="11" font-weight="600" fill="#2563eb" text-anchor="end">Edit freely</text>
    </g>

    <!-- Quick Correction Chips -->
    <g transform="translate(0, 500)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#475569">Quick helpers:</text>
      
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="100" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
        <text x="10" y="17" font-size="10" font-weight="600" fill="#334155">+ Clean spaces</text>

        <rect x="108" y="0" width="110" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
        <text x="118" y="17" font-size="10" font-weight="600" fill="#334155">+ Fix date typo</text>

        <rect x="226" y="0" width="124" height="26" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
        <text x="236" y="17" font-size="10" font-weight="600" fill="#334155">+ Restore original</text>
      </g>
    </g>

    <!-- Primary Action: Simplify Document Button -->
    <g transform="translate(0, 565)">
      <rect width="350" height="56" rx="16" fill="#2563eb" filter="url(#shadow)"/>
      <text x="175" y="34" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Generate plain-language explanation →</text>
    </g>

    <text x="175" y="640" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">Takes ~2 seconds • Encrypted ephemeral analysis</text>
  </g>
</svg>
