<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#f8fafc; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="390" height="844" fill="#f8fafc"/>

  <!-- Top Mobile Status Bar -->
  <text x="28" y="28" font-size="14" font-weight="700" fill="#0f172a">9:41</text>
  <circle cx="340" cy="24" r="3" fill="#0f172a"/>
  <circle cx="348" cy="24" r="3" fill="#0f172a"/>
  <rect x="356" y="20" width="16" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="358" y="22" width="10" height="4" rx="1" fill="#0f172a"/>

  <!-- Header Navbar -->
  <g id="Navbar" transform="translate(0, 44)">
    <rect width="390" height="56" fill="#ffffff" filter="url(#shadow)"/>
    
    <!-- Logo -->
    <rect x="20" y="14" width="28" height="28" rx="8" fill="#2563eb"/>
    <path d="M28 22h8M28 26h12M28 30h9" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="56" y="33" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="-0.5">DocClear</text>
    
    <!-- PWA Pill -->
    <rect x="142" y="19" width="34" height="18" rx="9" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="149" y="32" font-size="10" font-weight="700" fill="#2563eb">PWA</text>
    
    <!-- Right Actions -->
    <rect x="260" y="15" width="46" height="26" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="268" y="32" font-size="11" font-weight="700" fill="#334155">A- A+</text>

    <text x="325" y="32" font-size="12" font-weight="600" fill="#2563eb">Evaluation</text>
  </g>

  <!-- Content Container -->
  <g transform="translate(20, 116)">
    <!-- Main Headline -->
    <text x="0" y="32" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Understand any</text>
    <text x="0" y="66" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">complex document.</text>
    
    <text x="0" y="98" font-size="13" font-weight="500" fill="#64748b">Snap it or upload it. Get a plain-language explanation</text>
    <text x="0" y="116" font-size="13" font-weight="500" fill="#64748b">you can read or listen to.</text>

    <!-- 3 Steps Stepper -->
    <g transform="translate(0, 136)">
      <rect x="0" y="0" width="108" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="16" font-size="10" font-weight="600" fill="#334155">1 Upload or snap</text>

      <rect x="114" y="0" width="86" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="124" y="16" font-size="10" font-weight="600" fill="#334155">2 We simplify</text>

      <rect x="206" y="0" width="94" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="216" y="16" font-size="10" font-weight="600" fill="#334155">3 Read or listen</text>
    </g>

    <!-- Primary Action: Use Camera Button -->
    <g transform="translate(0, 180)">
      <rect width="350" height="56" rx="16" fill="#2563eb" filter="url(#shadow)"/>
      <path d="M142 33a4 4 0 1 0 8 0 4 4 0 0 0-8 0m-4-6h3l2-3h8l2 3h3a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-18a3 3 0 0 1-3-3V30a3 3 0 0 1 3-3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="175" y="34" font-size="16" font-weight="700" fill="#ffffff">Use camera</text>
    </g>

    <!-- Secondary Action: Upload or Drop File Button -->
    <g transform="translate(0, 248)">
      <rect width="350" height="56" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>
      <path d="M136 32l6-6 6 6m-6-6v12m-8 4h16a4 4 0 0 0 4-4v-1a4 4 0 0 0-3-3.9 5 5 0 0 0-9.8-1.5A4 4 0 0 0 130 38a4 4 0 0 0 4 4" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="160" y="34" font-size="15" font-weight="700" fill="#2563eb">Upload or drop file</text>
    </g>

    <text x="0" y="324" font-size="11" font-weight="500" fill="#94a3b8">PDF, DOCX, JPG, PNG, TXT. Up to 15 MB.</text>

    <!-- Privacy Banner -->
    <g transform="translate(0, 342)">
      <rect width="350" height="48" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
      <path d="M16 24c0 6 8 11 8 11s8-5 8-11V16l-8-3-8 3z" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="24" font-size="11" font-weight="600" fill="#065f46">Your document is processed temporarily</text>
      <text x="40" y="38" font-size="11" font-weight="600" fill="#065f46">and never saved without permission.</text>
    </g>

    <!-- Quick Sample Documents Header -->
    <text x="0" y="420" font-size="14" font-weight="800" fill="#0f172a">Or try a realistic sample document:</text>

    <!-- Sample 1: Employment -->
    <g transform="translate(0, 436)">
      <rect width="350" height="60" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text x="16" y="26" font-size="14" font-weight="700" fill="#0f172a">Employment</text>
      <text x="16" y="44" font-size="11" font-weight="500" fill="#64748b">Job offer, salary &amp; 30-day notice terms</text>
      <text x="316" y="35" font-size="16" font-weight="700" fill="#2563eb">→</text>
    </g>

    <!-- Sample 2: Tenancy -->
    <g transform="translate(0, 508)">
      <rect width="350" height="60" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text x="16" y="26" font-size="14" font-weight="700" fill="#0f172a">Tenancy agreement</text>
      <text x="16" y="44" font-size="11" font-weight="500" fill="#64748b">Rent $1,850/mo, $3,700 bond &amp; 7-day grace</text>
      <text x="316" y="35" font-size="16" font-weight="700" fill="#2563eb">→</text>
    </g>

    <!-- Sample 3: Medical Bill -->
    <g transform="translate(0, 580)">
      <rect width="350" height="60" rx="14" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text x="16" y="26" font-size="14" font-weight="700" fill="#0f172a">Medical liability notice</text>
      <text x="16" y="44" font-size="11" font-weight="500" fill="#64748b">Co-payment $240.00 &amp; 14-day limit</text>
      <text x="316" y="35" font-size="16" font-weight="700" fill="#0d9488">→</text>
    </g>
  </g>

  <!-- Mobile Bottom Navigation Bar -->
  <g id="BottomNav" transform="translate(0, 784)">
    <rect width="390" height="60" fill="#ffffff" stroke="#e2e8f0"/>
    
    <!-- Tab 1: Home (Active) -->
    <circle cx="50" cy="22" r="3" fill="#2563eb"/>
    <text x="50" y="42" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Home</text>

    <!-- Tab 2: Review -->
    <text x="146" y="42" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Review</text>

    <!-- Tab 3: Evaluation -->
    <text x="244" y="42" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Evaluation</text>

    <!-- Tab 4: Settings -->
    <text x="340" y="42" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">Settings</text>
  </g>
</svg>
